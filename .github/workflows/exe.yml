# Windows programlarını (afi-sunucu.exe, afi-istemci.exe) GitHub'ın kendi bilgisayarlarında üretir.
# Çalıştırmak için: GitHub > Actions > "Windows programlari" > Run workflow
# Ayrıca main dalında program kodu değişince kendiliğinden çalışır ve exe'leri Releases sayfasına koyar
# (sürüm adı afi_sinif/ortak.py içindeki PLATFORM_SURUM'dan alınır, ör. v1.0.0).
name: Windows programlari

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "afi_sinif/**"
      - "afi-sunucu.py"
      - "afi-istemci.py"
      - "tests/**"
      - "tools/ikon/**"
      - "kurulum/**"
      - ".github/workflows/exe.yml"

permissions:
  contents: write

jobs:
  test:
    name: Testler (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover tests -v

  exe:
    name: exe uret
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"    # Windows 8.1, 10 ve 11'de çalışır
      - run: pip install pyinstaller==6.11.1
      - name: afi-sunucu.exe
        run: pyinstaller --noconfirm --onefile --console --name afi-sunucu --icon tools/ikon/afi-sunucu.ico --add-data "afi_sinif/panel;afi_sinif/panel" --add-data "afi_sinif/paketler;afi_sinif/paketler" afi-sunucu.py
      - name: afi-istemci.exe
        run: pyinstaller --noconfirm --onefile --noconsole --name afi-istemci --icon tools/ikon/afi-istemci.ico --add-data "afi_sinif/paketler;afi_sinif/paketler" afi-istemci.py
      - name: Deneme
        timeout-minutes: 4
        shell: pwsh
        run: |
          $hata = $false
          function Dene($ad, $exe, $argv) {
            $out = "$env:RUNNER_TEMP\$ad-out.txt"; $err = "$env:RUNNER_TEMP\$ad-err.txt"
            $p = Start-Process -FilePath $exe -ArgumentList $argv -PassThru -RedirectStandardOutput $out -RedirectStandardError $err -NoNewWindow
            $null = $p.Handle
            $bitti = $p.WaitForExit(60000)
            $metin = ((Get-Content $out -Raw -ErrorAction SilentlyContinue) + " | " + (Get-Content $err -Raw -ErrorAction SilentlyContinue)) -replace "`r?`n", " / "
            $gunluk = Get-ChildItem "$env:RUNNER_TEMP\$ad-veri" -Recurse -Filter gunluk.txt -ErrorAction SilentlyContinue | Get-Content -Raw
            if (-not $bitti) { $p.Kill($true); Write-Host "::error::$ad 60 saniyede bitmedi. Çıktı: $metin Günlük: $($gunluk -replace "`r?`n", ' / ')"; return $false }
            if ($p.ExitCode -ne 0) { Write-Host "::error::$ad çıkış kodu $($p.ExitCode). Çıktı: $metin Günlük: $($gunluk -replace "`r?`n", ' / ')"; return $false }
            Write-Host "::notice::$ad tamam: $metin"; return $true
          }
          if (-not (Dene "sunucu" "dist\afi-sunucu.exe" @("--deneme", "--tarayici-acma", "--port", "8123", "--veri", "$env:RUNNER_TEMP\sunucu-veri"))) { $hata = $true }
          if (-not (Dene "istemci" "dist\afi-istemci.exe" @("--deneme", "--port", "8124", "--veri", "$env:RUNNER_TEMP\istemci-veri"))) { $hata = $true }
          Get-ChildItem dist
          if ($hata) { exit 1 }
      - name: Surum numarasi
        id: surum
        shell: pwsh
        run: |
          $s = python -c "from afi_sinif import ortak; print(ortak.PLATFORM_SURUM)"
          "surum=$s" >> $env:GITHUB_OUTPUT
          "etiket=v$s" >> $env:GITHUB_OUTPUT
      - name: Kurulum dosyasi (Inno Setup)
        shell: pwsh
        env:
          AFI_SURUM: ${{ steps.surum.outputs.surum }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /? | Select-Object -First 1
          $cikti = & $iscc "kurulum\afi-sinif.iss" 2>&1
          if ($LASTEXITCODE -ne 0) {
            $son = ($cikti | Select-Object -Last 25) -join " / "
            Write-Host "::error::Inno Setup derleme hatası: $son"
            exit 1
          }
          $uyari = ($cikti | Where-Object { $_ -match "Warning" }) -join " / "
          if ($uyari) { Write-Host "::warning::Inno Setup uyarıları: $uyari" }
          Get-Item dist\afi-sinif-kurulum.exe | Format-List Name, Length
      - name: Kurulum denemesi (sessiz kurulum, rol degistirme, kaldirma)
        timeout-minutes: 10
        shell: pwsh
        run: ./kurulum/betik/dene.ps1
      - name: Kurulum ekran goruntuleri
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        run: |
          ./kurulum/betik/ekran.ps1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $gecici = Join-Path $env:RUNNER_TEMP "ekranlar"
          Copy-Item ekranlar $gecici -Recurse -Force
          git checkout --orphan ekranlar-dal
          git rm -r -q --cached .
          Remove-Item ekranlar -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item $gecici ekranlar -Recurse
          git add ekranlar
          git commit -q -m "Kurulum ekran görüntüleri ${{ github.sha }}"
          git push -f origin HEAD:ekranlar
      - uses: actions/upload-artifact@v4
        with:
          name: afi-sinif-windows
          path: |
            dist/*.exe
      - name: Surum sayfasi
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.surum.outputs.etiket }}
          name: afi sınıf ${{ steps.surum.outputs.etiket }}
          target_commitish: ${{ github.sha }}
          body: |
            Tek kurulum dosyası: afi-sinif-kurulum.exe — kurulum sırasında "Öğretmen bilgisayarı (sunucu)" ya da "Öğrenci bilgisayarı (istemci)" seçilir.
            Kurulum rehberi: https://aydinincekara.github.io/isikcirobot_offline/
          files: |
            dist/afi-sinif-kurulum.exe
